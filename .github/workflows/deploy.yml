name: Deploy

# Deploys only run after the Test workflow has PASSED for the same commit on
# main (workflow_run), never in parallel with it - a red build must not ship.
#
# Production runs on Railway (see docs/LAUNCH_CHECKLIST.md), which deploys from
# GitHub itself - so it must NOT watch `main`, or every push ships in parallel
# with CI. The promote-production job below fast-forwards the `production`
# branch to a commit only after Test passed on it; point the Railway API and
# worker services at the `production` branch. The Fly.io jobs are kept for an
# optional Fly target and only run when ENABLE_FLY_DEPLOY is 'true'.
#
# OTA updates are NOT published automatically on every push: mobile/app.json
# uses a static runtimeVersion, so an OTA built after a native-module change
# would reach older binaries that lack the module and crash them. Publish
# manually (Actions → Deploy → Run workflow on main → publish_ota). The run is
# refused unless it is on main, the mobile tests pass, and
# scripts/check-ota-safe.cjs finds no native-affecting change since the commit
# the installed binaries were built from (mobile/ota-baseline.json) (N16).
# After a native change: bump runtimeVersion (app.json + android strings.xml),
# ship new binaries, then update mobile/ota-baseline.json.

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_ota:
        description: "Publish an EAS OTA update to the production channel"
        type: boolean
        default: false

jobs:
  promote-production:
    name: Promote tested commit to the production branch
    # Only a commit whose Test run passed on main ever reaches `production`,
    # which is the branch Railway deploys from.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          # GITHUB_TOKEN may not push a commit that changes .github/workflows.
          # A fine-grained PAT (contents + workflows: write) in PROMOTE_TOKEN
          # lets those commits reach production too.
          token: ${{ secrets.PROMOTE_TOKEN || github.token }}
      - name: Fast-forward production to the tested commit
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin production || true
          if git rev-parse --verify -q origin/production >/dev/null; then
            # Never move production backwards or sideways: the tested commit
            # must contain the current production commit.
            if ! git merge-base --is-ancestor origin/production "$TESTED_SHA"; then
              echo "::notice::$TESTED_SHA does not descend from production; skipping (a newer tested commit was already promoted)."
              exit 0
            fi
          fi
          git push origin "$TESTED_SHA:refs/heads/production"

  deploy-api:
    name: Deploy API to Fly.io
    if: >-
      vars.ENABLE_FLY_DEPLOY == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@1.6

      - name: Deploy API
        run: flyctl deploy --config fly.api.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-worker:
    name: Deploy Worker to Fly.io
    if: >-
      vars.ENABLE_FLY_DEPLOY == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@1.6

      - name: Deploy Worker
        run: flyctl deploy --config fly.worker.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  ota-gate:
    name: OTA gate (main, mobile tests, native compatibility)
    if: github.event_name == 'workflow_dispatch' && inputs.publish_ota
    runs-on: ubuntu-latest
    steps:
      - name: Only main may publish to the production channel
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::OTA updates publish only from main (got $REF)."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No native change since the installed binaries
        run: node scripts/check-ota-safe.cjs

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: mobile

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: mobile

      - name: Mobile tests
        run: npm test -- --runInBand
        working-directory: mobile

  update-mobile:
    name: OTA Update Mobile
    needs: ota-gate
    if: github.event_name == 'workflow_dispatch' && inputs.publish_ota && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        # --legacy-peer-deps is required (see mobile/CLAUDE.md).
        run: npm ci --legacy-peer-deps
        working-directory: mobile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: 25.2.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update
        # The message comes from the commit and is attacker-influenced: pass it
        # through an env var, never interpolate ${{ }} into the shell script.
        env:
          UPDATE_MESSAGE: ${{ github.event.head_commit.message || github.sha }}
        run: eas update --branch production --message "$UPDATE_MESSAGE" --non-interactive
        working-directory: mobile
