<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ode - Goal Transition</title>
<style>
@font-face{font-family:Erode;src:url('../mobile/assets/fonts/Erode-Light.ttf')}@font-face{font-family:Hanken;src:local('Arial')}
*{box-sizing:border-box}body{margin:0;background:#090b0c;color:#eceeec;font:14px/1.5 Hanken,Arial,sans-serif;letter-spacing:0}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid #e8ddd0;outline-offset:4px}button:active{transform:scale(.98)}
.workspace{min-height:100vh;display:grid;grid-template-columns:260px minmax(0,1fr);max-width:1120px;margin:auto;gap:80px;padding:44px 32px}.controls{padding-top:32px}.wordmark{font:44px/1 Erode,Georgia,serif;margin:0 0 44px}.controls h1{font-size:20px;line-height:1.3;font-weight:500;margin:0 0 28px}.label{display:block;font-size:12px;color:#9da7a4;margin:24px 0 10px}.segmented{display:flex;background:#171b1d;padding:3px;border-radius:6px;gap:3px}.segmented button{flex:1;background:none;border:0;padding:9px 8px;border-radius:4px;color:#a7b0ad}.segmented button[aria-pressed=true]{color:#fff;background:#353e3d}.toggle{display:flex;justify-content:space-between;align-items:center;margin-top:25px;gap:12px}.toggle input{accent-color:#b5c9bd;width:18px;height:18px}.replay{background:none;border:1px solid #39423e;border-radius:6px;width:40px;height:36px;font-size:24px;line-height:1}.tools{display:flex;align-items:center;justify-content:space-between;margin-top:28px;color:#b4bdb8}.palette{display:flex;gap:9px;margin-top:14px}.palette span{width:20px;height:20px;border-radius:50%;border:1px solid #ffffff30}.stage{position:relative;width:min(100%,390px);height:844px;max-height:calc(100vh - 56px);min-height:610px;margin:0 auto;isolation:isolate;border-radius:28px;overflow:hidden;outline:1px solid #48504b;background:var(--bg);box-shadow:0 8px 8px #0005}
.screen{--bg:#18150f;--surface:#26221a;--ink:#e8ddd0;--accent:#c8955a;--muted:#a89c8e;--line:#c8955a24;position:absolute;inset:0;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}.statusbar{height:43px;flex-shrink:0;padding:13px 24px 0;display:flex;justify-content:space-between;font-weight:600;font-size:12px}.statusicons{display:flex;align-items:center;gap:5px}.signal{width:12px;height:9px;background:currentColor;clip-path:polygon(0 100%,100% 0,100% 100%)}.battery{width:20px;height:9px;border:1px solid currentColor;border-radius:2px;position:relative}.battery:before{content:'';position:absolute;inset:1px;background:currentColor}.battery:after{content:'';position:absolute;right:-3px;top:2px;width:2px;height:3px;background:currentColor}.appheader{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line)}.appbrand{font:32px Erode,Georgia,serif}.avatar{display:flex;align-items:center;justify-content:center;background:var(--surface);border-radius:50%;height:32px;width:32px;color:var(--accent);font-size:12px}.scroll{padding:27px 23px 16px;overflow:auto;flex:1;scrollbar-width:thin;scrollbar-color:#ffffff20 transparent}h2{font:31px/1.2 Erode,Georgia,serif;margin:0 0 24px}.profile{display:flex;gap:13px;align-items:center;margin-bottom:26px}.profile .avatar{width:43px;height:43px;font-size:14px}.profile strong{display:block;font-size:15px;font-weight:500}.profile small{color:var(--muted);font-size:12px}.sectiontitle{font-size:12px;color:var(--muted);margin:0 0 11px}.setting{padding:14px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:14px}.setting small{color:var(--muted);font-size:12px}.setting .chevron{border:solid var(--muted);border-width:0 1px 1px 0;padding:3px;transform:rotate(-45deg);margin-right:3px}.goalhead{display:flex;align-items:center;justify-content:space-between;margin:23px 0 13px}.goalhead h3{font-size:15px;font-weight:500;margin:0}.goalhead .current{color:var(--muted);font-size:11px}.goals{margin:0 -1px}.goal{display:grid;grid-template-columns:12px 1fr 18px;gap:12px;align-items:center;width:100%;padding:12px 10px;text-align:left;border:1px solid transparent;border-bottom-color:var(--line);border-radius:0;background:none;min-height:64px;position:relative}.goal[aria-checked=true]{background:var(--surface);border-color:var(--accent);border-radius:6px}.swatch{height:9px;width:9px;border-radius:50%;background:var(--goal-accent)}.goalname{display:block;font-size:13px;font-weight:500;line-height:1.3}.goaldesc{display:block;color:var(--muted);font-size:11px;line-height:1.45;margin-top:4px}.check{color:var(--accent);font-size:17px;opacity:0}.goal[aria-checked=true] .check{opacity:1}.bottomnav{height:72px;flex-shrink:0;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;background:var(--bg);padding-bottom:10px}.navitem{font-size:10px;display:grid;gap:4px;justify-items:center;color:var(--muted)}.navitem.active{color:var(--accent)}.navicon{font-size:20px;line-height:24px}.homebar{position:absolute;bottom:5px;width:100px;height:4px;border-radius:2px;background:var(--ink);left:calc(50% - 50px);opacity:.65}.snapshot{pointer-events:none;z-index:3}.flood{position:absolute;z-index:4;border-radius:50%;width:100px;height:100px;pointer-events:none;transform:scale(0)}
@media(max-width:760px){.workspace{display:flex;flex-direction:column;gap:24px;padding:20px 14px}.controls{padding:0;max-width:390px;width:100%;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}.wordmark{font-size:30px;margin:0}.controls h1{font-size:16px;margin:0;align-self:center;text-align:right}.label,.palette{display:none}.segmented{grid-column:1/-1}.toggle,.tools{margin:0}.stage{max-height:none;height:844px;min-height:0;border-radius:20px;width:min(100%,390px)}.tools{justify-content:flex-end}.tools>span{display:none}}
@media(prefers-reduced-motion:reduce){button:active{transform:none}}
</style>
</head>
<body>
<main class="workspace">
 <aside class="controls"><div class="wordmark">ode</div><h1>Goal transition</h1><span class="label">Motion</span><div class="segmented" aria-label="Transition version"><button id="smooth" aria-pressed="true">Smooth</button><button id="current" aria-pressed="false">Current</button></div><label class="toggle">Reduced motion<input id="reduced" type="checkbox"></label><div class="tools"><span id="goal-label">Just exploring</span><button class="replay" id="replay" aria-label="Replay transition" title="Replay transition">&#8635;</button></div><div class="palette" aria-hidden="true" id="palette"></div></aside>
 <section class="stage" aria-label="Ode interactive goal picker">
  <div class="screen" id="screen">
   <div class="statusbar"><span>9:41</span><div class="statusicons"><span class="signal"></span><span class="battery"></span></div></div>
   <header class="appheader"><span class="appbrand">ode</span><span class="avatar">BJ</span></header>
   <div class="scroll"><h2>Settings</h2><div class="profile"><span class="avatar">BJ</span><div><strong>Bharat</strong><small>Your private space</small></div></div><p class="sectiontitle">Your preferences</p><div class="setting"><span>Reflection language</span><small>English</small></div><div class="setting"><span>Daily check-in</span><small>8:00 AM</small></div><div class="goalhead"><h3>Emotional goal</h3><span class="current">Choose your focus</span></div><div class="goals" id="goals" role="radiogroup" aria-label="Emotional goal"></div></div>
   <nav class="bottomnav" aria-label="App navigation"><span class="navitem"><span class="navicon">&#8962;</span>Home</span><span class="navitem"><span class="navicon">&#9776;</span>Journal</span><span class="navitem"><span class="navicon">&#9716;</span>Mood</span><span class="navitem active"><span class="navicon">&#9881;</span>Settings</span></nav><span class="homebar"></span>
  </div>
 </section>
</main>
<script>
const themes={
 curious:{bg:'#18150f',surface:'#26221a',ink:'#e8ddd0',accent:'#c8955a',muted:'#b5a99b',name:'Just exploring',desc:'No agenda. A little space to discover.'},
 anxiety:{bg:'#1A2B20',surface:'#233428',ink:'#F0EDEA',accent:'#7B9E87',muted:'#b7c2b8',name:'Working through anxiety',desc:'Worry, uncertainty, restless thoughts'},
 stress:{bg:'#0F1E2E',surface:'#1A2D40',ink:'#E8F0F5',accent:'#5B8DB8',muted:'#a8bbc9',name:'Managing stress',desc:'Overwhelm, pressure, too much on my plate'},
 grief:{bg:'#1C1820',surface:'#2A2434',ink:'#EDE8F5',accent:'#9B8AB8',muted:'#bcb3c8',name:'Processing grief',desc:'Loss, endings, and making room for memory'},
 depression:{bg:'#1A160A',surface:'#28200F',ink:'#F5EDD0',accent:'#C49E34',muted:'#c2b79a',name:'Lifting low mood',desc:'Sadness, low motivation, feeling flat'},
 relationships:{bg:'#221518',surface:'#32201E',ink:'#F5EAE8',accent:'#C87F7F',muted:'#c6b0ad',name:'Understanding relationships',desc:'Connection, conflict, how I show up for others'},
 career:{bg:'#0C1A1A',surface:'#182C2C',ink:'#E0EEF0',accent:'#409494',muted:'#a7bdbd',name:'Career & purpose',desc:'Work, direction, what I am building toward'},
 trauma:{bg:'#1C1410',surface:'#2E1E16',ink:'#F0E4D8',accent:'#B86C48',muted:'#c1ad9e',name:'Processing the past',desc:'Difficult memories, healing, finding steadiness'}
};
const screen=document.querySelector('#screen'),stage=document.querySelector('.stage'),goals=document.querySelector('#goals');
let selected='curious',previous='anxiety',mode='smooth',busy=false,pending=null;
const order=['anxiety','stress','grief','depression','relationships','career','trauma','curious'];
goals.innerHTML=order.map(key=>`<button class="goal" role="radio" data-goal="${key}" aria-checked="${key===selected}" style="--goal-accent:${themes[key].accent}"><span class="swatch"></span><span><span class="goalname">${themes[key].name}</span><span class="goaldesc">${themes[key].desc}</span></span><span class="check" aria-hidden="true">&#10003;</span></button>`).join('');
function apply(key){const t=themes[key];for(const prop of ['bg','surface','ink','accent','muted'])screen.style.setProperty('--'+prop,t[prop]);screen.style.setProperty('--line',t.accent+'24');screen.querySelectorAll('[data-goal]').forEach(b=>b.setAttribute('aria-checked',String(b.dataset.goal===key)));document.querySelector('#goal-label').textContent=t.name;document.querySelector('#palette').innerHTML=['bg','surface','accent','ink'].map(p=>`<span style="background:${t[p]}"></span>`).join('');selected=key;}
function complete(){busy=false;if(pending){const next=pending;pending=null;change(next.key,next.x,next.y)}}
async function change(key,x=195,y=400){if(key===selected&&!busy)return;if(busy){pending={key,x,y};return}busy=true;previous=selected;
 const reduced=document.querySelector('#reduced').checked||matchMedia('(prefers-reduced-motion:reduce)').matches;
 if(reduced){apply(key);complete();return}
 if(mode==='current'){
  await new Promise(r=>setTimeout(r,300));const circle=document.createElement('div');circle.className='flood';circle.style.cssText=`left:${x-50}px;top:${y-50}px;background:${themes[key].bg}`;stage.append(circle);const radius=Math.hypot(Math.max(x,stage.clientWidth-x),Math.max(y,stage.clientHeight-y));await circle.animate([{transform:'scale(0)'},{transform:`scale(${radius/50*1.15})`}],{duration:1250,easing:'cubic-bezier(.35,.01,.08,1)',fill:'forwards'}).finished;apply(key);await circle.animate([{opacity:1},{opacity:0}],{duration:450,fill:'forwards'}).finished;circle.remove();complete();return;
 }
 const old=screen.cloneNode(true);old.removeAttribute('id');old.classList.add('snapshot');old.setAttribute('aria-hidden','true');old.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));old.querySelectorAll('button').forEach(e=>e.tabIndex=-1);stage.append(old);apply(key);await old.animate([{opacity:1},{opacity:0}],{duration:280,easing:'cubic-bezier(.22,1,.36,1)',fill:'forwards'}).finished;old.remove();complete();
}
goals.addEventListener('click',e=>{const button=e.target.closest('[data-goal]');if(!button)return;const bounds=stage.getBoundingClientRect();change(button.dataset.goal,e.clientX-bounds.left,e.clientY-bounds.top)});
for(const m of ['smooth','current'])document.querySelector('#'+m).onclick=()=>{mode=m;for(const id of ['smooth','current'])document.querySelector('#'+id).setAttribute('aria-pressed',String(id===m))};
document.querySelector('#replay').onclick=()=>change(previous);
apply(selected);
window.odePreview={select:key=>change(key),getState:()=>({selected,busy,pending:pending?.key,mode}),themes};
</script>
</body></html>
