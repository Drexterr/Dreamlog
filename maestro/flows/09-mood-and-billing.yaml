# ═══════════════════════════════════════════════════════════════════════════
# MOOD TAB + BILLING/UPGRADE
# Closes the coverage gap on app/(tabs)/mood.tsx and app/upgrade.tsx — neither
# had any Maestro coverage before this flow (see docs/TESTING.md discussion).
#
# Covers: streak cards, renewal dialog (no freeze consumed), Life Graph ranges,
# reviews in Explore, and review share-card preview. Native sharing is not
# scripted; see 03-authentication.yaml for the same limitation with OAuth. Also covers
# the Upgrade screen's monthly/annual toggle + plan cards. The purchase CTA
# itself is NOT tapped — it launches the native App Store / Google Play
# purchase sheet, another un-scriptable OS modal (same category as the share sheet / OAuth dialogs).
#
# REQUIRES:
#   • A running backend for mood/streak/billing data. All data-dependent
#     assertions are `optional: true` so the flow still validates the UI
#     against a fresh/empty account.
#   • A verified account (EMAIL_EXISTING / PASSWORD).
# ═══════════════════════════════════════════════════════════════════════════
appId: com.talktoode.app
incompleteReason: Lost-streak/populated-review device fixtures and Play sandbox remain unclosed; unit tests cover the new state transitions.
env:
  EMAIL_EXISTING: "bharatbanthia2207+tester@gmail.com"
  PASSWORD: "DreamTest!2026"
tags:
  - mood
  - billing
---
- stopApp
- launchApp:
    clearKeychain: true
    permissions:
      notifications: allow
- runFlow: ../subflows/dismiss-startup-streak.yaml
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 60000
- tapOn:
    id: tab-settings
- tapOn:
    id: settings-profile-card
- assertQaIdentity:
    timeout: 30000
- tapOn:
    id: settings-profile-modal-close

# ─────────────────────────────────────────────────────────────────────────
# MOOD 1 — Mood tab renders (streaks, chart, Life Graph)
# ─────────────────────────────────────────────────────────────────────────
- tapOn:
    id: "tab-mood"
- extendedWaitUntil:
    visible:
      id: "mood-screen"
    timeout: 10000

# Dismiss the milestone celebration modal if the account's streak happens to
# land on 7/21/50/100 right now (MilestoneModal in mood.tsx renders as a
# full-screen native Modal, which overlays the tab bar too and would
# otherwise silently swallow every subsequent tap in this flow).
- runFlow:
    when:
      visible:
        id: "mood-milestone-continue"
    commands:
      - tapOn:
          id: "mood-milestone-continue"
      - extendedWaitUntil:
          visible:
            id: "mood-screen"
          timeout: 6000

- assertVisible: "Mood Map"
- takeScreenshot: "mood-screen"

# Renewal is available for active or broken streaks. Inspect, then dismiss;
# automated navigation checks must not consume an account's freeze.
- runFlow:
    when:
      visible:
        id: mood-renew-streak
    commands:
      - tapOn:
          id: mood-renew-streak
      - assertVisible:
          id: streak-renewal-dialog
      - assertVisible:
          id: renew-freeze-count
      - assertVisible:
          id: renew-streak-confirm
      - tapOn:
          id: renew-streak-dismiss
- assertNotVisible:
    id: mood-share-streak
- scrollUntilVisible:
    element:
      id: mood-range-90d
    direction: DOWN
    timeout: 30000

# ─────────────────────────────────────────────────────────────────────────
# MOOD 4 — Life Graph range selector (30D / 90D / 1Y)
# ─────────────────────────────────────────────────────────────────────────
- runFlow:
    required: true
    when:
      visible:
        id: "mood-range-90d"
    commands:
      - tapOn:
          id: "mood-range-90d"
      - extendedWaitUntil:
          visible:
            id: "mood-range-90d"
          timeout: 6000
      - tapOn:
          id: "mood-range-365d"
      - tapOn:
          id: "mood-range-30d"
      - takeScreenshot: "mood-life-graph-ranges"
# Mood now links to reviews instead of rendering long-form review sections.
- scrollUntilVisible:
    element:
      id: mood-open-reflections
    direction: DOWN
    timeout: 30000
- assertNotVisible: WEEKLY REVIEW
- assertNotVisible: YEAR IN REVIEW
- tapOn:
    id: mood-open-reflections
- extendedWaitUntil:
    visible:
      id: explore-reflections
    timeout: 10000
- extendedWaitUntil:
    notVisible:
      id: explore-reviews-loading
    timeout: 30000
# Review availability depends on the account's generated data.
- runFlow:
    when:
      visible:
        id: explore-share-review
    commands:
      - tapOn:
          id: explore-share-review
      - extendedWaitUntil:
          visible:
            id: mood-share-modal-cancel
          timeout: 8000
      - tapOn:
          id: mood-share-modal-cancel
      - assertVisible:
          id: explore-screen
- runFlow:
    when:
      visible:
        id: weekly-review-show-more
    commands:
      - tapOn:
          id: weekly-review-show-more
      - assertVisible: Show less
      - tapOn:
          id: weekly-review-show-more
      - assertVisible: Show more
- tapOn:
    id: tab-mood
- assertVisible:
    id: mood-screen
- assertNotVisible:
    id: streak-renewal-dialog

# ─────────────────────────────────────────────────────────────────────────
# BILLING 1 — Upgrade screen: reached from Settings, plan cards + toggle
# ─────────────────────────────────────────────────────────────────────────
- tapOn:
    id: "tab-settings"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 10000
- openLink: ode://upgrade
- extendedWaitUntil:
    visible:
      id: upgrade-screen
    timeout: 30000
- runFlow:
    required: true
    when:
      visible:
        id: "upgrade-screen"
    commands:
      - assertVisible:
          id: "upgrade-screen"
      - assertVisible: "Choose a Plan"
      - takeScreenshot: "upgrade-screen-annual"

      # Toggle to monthly pricing and back to annual (default).
      - tapOn:
          id: "upgrade-period-monthly"
      - assertVisible: Monthly
      - extendedWaitUntil:
          visible:
            id: "upgrade-period-monthly"
          timeout: 6000
      - takeScreenshot: "upgrade-screen-monthly"
      - tapOn:
          id: "upgrade-period-annual"
      - assertVisible: Annual

      # CTA buttons render (not tapped — launches the native store purchase sheet).
      - assertVisible:
          id: "upgrade-cta-plus"
          optional: true

      - tapOn:
          id: "upgrade-back"
      - extendedWaitUntil:
          visible:
            id: "settings-screen"
          timeout: 8000
