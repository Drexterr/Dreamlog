# ═══════════════════════════════════════════════════════════════════════════
# NAVIGATION TESTING
# Every bottom tab reachable, Explore tools open + back-navigate, modal
# navigation (Settings sheets) opens/closes, and deep links via "dreamlog://".
# Tabs carry stable testIDs (tabBarButtonTestID in app/(tabs)/_layout.tsx).
# ═══════════════════════════════════════════════════════════════════════════
appId: com.dreamlog.app
env:
  APP_SCHEME: "dreamlog"
tags:
  - navigation
---
- clearState
- launchApp:
    clearKeychain: true
- runFlow: ../subflows/complete-onboarding-guest.yaml

# ── 1. All four tabs are reachable ──
- assertVisible:
    id: "home-screen"
- tapOn:
    id: "tab-explore"
- assertVisible:
    id: "explore-screen"
- takeScreenshot: "nav-explore"

- tapOn:
    id: "tab-mood"
- assertVisible:
    text: "Mood"
    timeout: 8000
- takeScreenshot: "nav-mood"

- tapOn:
    id: "tab-settings"
- assertVisible:
    id: "settings-screen"
- takeScreenshot: "nav-settings"

- tapOn:
    id: "tab-home"
- assertVisible:
    id: "home-screen"

# ── 2. Explore → each tool screen opens and back returns to Explore ──
- tapOn:
    id: "tab-explore"
- tapOn:
    id: "explore-entries"
- assertVisible:
    text: "Search your entries..."
    timeout: 8000
- back
- assertVisible:
    id: "explore-screen"

- tapOn:
    id: "explore-journeys"
- assertVisible:
    text: "Guided Journeys"
    timeout: 8000
- back
- assertVisible:
    id: "explore-screen"

- tapOn:
    id: "explore-relationships"
- back
- assertVisible:
    id: "explore-screen"

# ── 3. Modal navigation: Settings → Get help now opens a sheet, closes via
#       its Close button without leaving Settings. ──
- tapOn:
    id: "tab-settings"
- tapOn:
    id: "settings-help-row"
- assertVisible: "You're not alone."
- assertVisible: "iCall"
- tapOn: "Close"
- assertVisible:
    id: "settings-screen"
- takeScreenshot: "nav-crisis-modal-closed"

# ── 4. Nudge-hour picker modal opens and dismisses via backdrop tap ──
- tapOn:
    id: "settings-nudge-hour-row"
- assertVisible: "Morning Nudge Time"
- tapOn:
    point: "50%,12%"                  # dimmed backdrop above the sheet
- assertNotVisible: "Morning Nudge Time"

# ── 5. Deep link: scheme "dreamlog" → therapy route surfaces the landing. ──
- openLink: ${APP_SCHEME}://therapy
- assertVisible:
    text: "Start a Session"
    timeout: 10000
    optional: true                    # deep-link route table may vary by build
- takeScreenshot: "nav-deeplink-therapy"
