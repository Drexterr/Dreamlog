# ═══════════════════════════════════════════════════════════════════════════
# NAVIGATION TESTING
# Every bottom tab reachable, Explore tools open + back-navigate, modal
# navigation (Settings sheets) opens/closes. Tabs carry stable testIDs
# (tabBarButtonTestID in app/(tabs)/_layout.tsx).
# ═══════════════════════════════════════════════════════════════════════════
appId: com.dreamlog.app
tags:
  - navigation
---
- clearState
- launchApp:
    clearKeychain: true
- runFlow: ../subflows/complete-onboarding-guest.yaml

# ── 1. All four tabs are reachable ──
- assertVisible:
    id: "home-screen"
- tapOn:
    id: "tab-explore"
- extendedWaitUntil:
    visible:
      id: "explore-screen"
    timeout: 10000
- takeScreenshot: "nav-explore"

- tapOn:
    id: "tab-mood"
- extendedWaitUntil:
    visible:
      text: "Mood"
    timeout: 10000
- takeScreenshot: "nav-mood"

- tapOn:
    id: "tab-settings"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 10000
- takeScreenshot: "nav-settings"

- tapOn:
    id: "tab-home"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000

# ── 2. Explore → each tool screen opens and back returns to Explore ──
- tapOn:
    id: "tab-explore"
- tapOn:
    id: "explore-entries"
- extendedWaitUntil:
    visible:
      text: "Search your entries..."
    timeout: 10000
- back
- extendedWaitUntil:
    visible:
      id: "explore-screen"
    timeout: 10000

- tapOn:
    id: "explore-journeys"
- extendedWaitUntil:
    visible:
      text: "Guided Journeys"
    timeout: 10000
- back
- extendedWaitUntil:
    visible:
      id: "explore-screen"
    timeout: 10000

- tapOn:
    id: "explore-relationships"
- back
- extendedWaitUntil:
    visible:
      id: "explore-screen"
    timeout: 10000

# ── 3. Modal navigation: Settings → Get help now opens a sheet, closes via
#       its Close button without leaving Settings. ──
- tapOn:
    id: "tab-settings"
- tapOn:
    id: "settings-help-row"
- extendedWaitUntil:
    visible:
      text: "iCall"                    # a crisis hotline card in the sheet
    timeout: 10000
- tapOn: "Close"
- assertVisible:
    id: "settings-screen"
- takeScreenshot: "nav-crisis-modal-closed"

# ── 4. Nudge-hour picker modal opens and dismisses via backdrop tap ──
- tapOn:
    id: "settings-nudge-hour-row"
- extendedWaitUntil:
    visible:
      text: "Morning Nudge Time"
    timeout: 10000
- tapOn:
    point: "50%,12%"                   # dimmed backdrop above the sheet
- assertNotVisible: "Morning Nudge Time"
- takeScreenshot: "nav-nudge-picker-dismissed"
