# Reusable: walk the full guest onboarding from a freshly-installed state to the
# Home tab, WITHOUT signing in. Mirrors app/onboarding.tsx step machine.
#
# Precondition: app launched with cleared state, on the Welcome screen.
# Required env: ONBOARDING_GOAL_KEY, ONBOARDING_AGE_KEY, ONBOARDING_COUNTRY, PREFERRED_NAME
# Postcondition: on the Home tab as a guest.
#
# Selectors: stable testIDs (mobile/src/testIDs.ts). Each screen transition is
# gated by an extendedWaitUntil on the next screen's element, because the step
# machine animates between steps and some transitions run async work first.
appId: com.dreamlog.app
env:
  ONBOARDING_GOAL_KEY: "stress"
  ONBOARDING_AGE_KEY: "25_34"
  ONBOARDING_COUNTRY: "India"
  PREFERRED_NAME: "Sam"
---
# Step 0 — Welcome
- extendedWaitUntil:
    visible:
      id: "onboarding-welcome"
    timeout: 60000
- tapOn:
    id: "onboarding-begin"

# Intro — Skip straight to goal (tapping "next" 3× is flaky: the slide fade
# animation coalesces rapid taps). The carousel is exercised in 02-onboarding.
- extendedWaitUntil:
    visible:
      id: "onboarding-intro-skip"
    timeout: 10000
- tapOn:
    id: "onboarding-intro-skip"

# Step 1 — Goal (flood-fill transition)
- extendedWaitUntil:
    visible:
      id: "onboarding-goal-${ONBOARDING_GOAL_KEY}"
    timeout: 10000
- tapOn:
    id: "onboarding-goal-${ONBOARDING_GOAL_KEY}"

# Step 2 — Reveal (animated) → Continue
- extendedWaitUntil:
    visible:
      id: "onboarding-reveal-continue"
    timeout: 10000
- tapOn:
    id: "onboarding-reveal-continue"

# Step 3 — Preferred name (autoFocus input renders after the step transition)
- extendedWaitUntil:
    visible:
      id: "onboarding-name-input"
    timeout: 10000
- tapOn:
    id: "onboarding-name-input"
- inputText: ${PREFERRED_NAME}
- hideKeyboard
- tapOn:
    id: "onboarding-name-continue"

# Step 4 — Age range
- extendedWaitUntil:
    visible:
      id: "onboarding-age-${ONBOARDING_AGE_KEY}"
    timeout: 10000
- tapOn:
    id: "onboarding-age-${ONBOARDING_AGE_KEY}"
- tapOn:
    id: "onboarding-age-continue"

# Step 5 — Country: search + select. hideKeyboard before Continue (the soft
# keyboard overlays the button, so a tap would otherwise hit the keyboard).
- extendedWaitUntil:
    visible:
      id: "onboarding-country-input"
    timeout: 10000
- tapOn:
    id: "onboarding-country-input"
- inputText: ${ONBOARDING_COUNTRY}
- tapOn: ${ONBOARDING_COUNTRY}
- hideKeyboard
- tapOn:
    id: "onboarding-country-continue"

# Step 6 — Journal vs Reflection Session gate → Journal → tabs.
# country "Continue" runs an async handleFinish() before setStep(6) renders.
- extendedWaitUntil:
    visible:
      id: "onboarding-mode-journal"
    timeout: 10000
- tapOn:
    id: "onboarding-mode-journal"

# Landed on Home
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
