appId: com.talktoode.app
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 60000
- tapOn:
    id: tab-settings
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      id: settings-profile-card
    direction: UP
- tapOn:
    id: settings-profile-card
- assertQaIdentity:
    timeout: 30000
- tapOn:
    id: settings-profile-modal-close
- scrollUntilVisible:
    element:
      id: settings-voice-language-row
    direction: DOWN
- assertVisible: Hindi
- tapOn:
    id: settings-voice-language-row
- assertVisible: Currently Hindi
- tapOn: Auto
- waitForAnimationToEnd:
    timeout: 5000
- assertNotVisible: Could not save
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 60000
- tapOn:
    id: tab-settings
- waitForAnimationToEnd:
    timeout: 1500
- scrollUntilVisible:
    element:
      id: settings-voice-language-row
    direction: UP
- tapOn:
    id: settings-voice-language-row
- assertVisible: 'Auto, Replies in the language you speak each turn, ✓'
- assertVisible: Always reply in one language
- back
- tapOn:
    id: tab-home
